[package]
name = "simdlex"
version = "0.1.0"
edition = "2024"
description = "simdjson-style structural indexing as a primitive for any byte-level grammar"
license = "MIT"
repository = "https://github.com/zacharyvmm/simdlex"
autoexamples = false

[workspace]
members = ["examples/*"]

[workspace.dependencies]
simdlex = { path = "." }
criterion = "0.5"

