[package]
name = "simdlex"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/simdlex-tablegen", "crates/simdlex-index"]

[features]
default = []
json-test-grammar = []

[dependencies]
simdlex-index = { path = "crates/simdlex-index" }
simdlex-tablegen = { path = "crates/simdlex-tablegen" }

[dev-dependencies]
criterion = "0.5"
serde_json = "1"

[[bench]]
name = "class_spans"
harness = false

[[bench]]
name = "grammar_parser"
harness = false
required-features = ["json-test-grammar"]

[[example]]
name = "reference_bench"
required-features = ["json-test-grammar"]
