[package]
name = "simdlex-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
yaml-rust2 = "0.13.0"
simdlex = { path = ".." }
simdlex-html = { path = "../examples/html" }
simdlex-json = { path = "../examples/json" }
simdlex-yaml = { path = "../examples/yaml" }

[[bin]]
name = "json_stage1_backends"
path = "fuzz_targets/json_stage1_backends.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json_differential"
path = "fuzz_targets/json_differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "html_stream"
path = "fuzz_targets/html_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "yaml_differential"
path = "fuzz_targets/yaml_differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "index_windows"
path = "fuzz_targets/index_windows.rs"
test = false
doc = false
bench = false

[workspace]
